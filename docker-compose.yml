version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: aegisscan-postgres
    restart: always
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegissecretpassword2026
      POSTGRES_DB: aegisscan_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegisscan_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aegisscan-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegisscan-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      DATABASE_URL: postgresql+asyncpg://aegis:aegissecretpassword2026@postgres:5432/aegisscan_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: aegis_super_secret_jwt_key_startup_mvp_2026_change_in_prod
      ADMIN_DEFAULT_EMAIL: admin@aegisscan.com
      ADMIN_DEFAULT_PASSWORD: AegisScan2026!Secure
      RETENTION_HOURS: 24
    ports:
      - "8000:8000"
    volumes:
      - upload_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aegisscan-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: aegisscan-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  upload_data:
